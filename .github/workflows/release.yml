name: Release & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # 1. Bajar el código (fetch-depth: 0 es CRÍTICO para calcular el changelog)
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar entorno Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalar dependencias del proyecto
      - name: Install Dependencies
        run: npm ci

      # 4. Compilar la web con base para GitHub Pages
      - name: Build Web App
        run: npm run build
        env:
          NODE_ENV: production

      # 5. Calcular versión y generar Changelog automático
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # 6. Crear la Release en GitHub con los archivos de build
      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag_version.outputs.new_tag }}
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      # 7. Deploy a GitHub Pages
      - name: Deploy to GitHub Pages
        if: ${{ steps.tag_version.outputs.new_tag }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
