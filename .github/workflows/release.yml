name: Android CI/CD & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Calculamos qué tipo de subida de versión toca (sin crear el tag aún)
      - name: Determine Version Change
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true 

      # 2. Paso de depuración (opcional, para ver en logs qué detectó)
      - name: Log version info
        run: |
          echo "Detected bump part: ${{ steps.tag_version.outputs.part }}"
          echo "Next version: ${{ steps.tag_version.outputs.new_tag }}"

      # --- A partir de aquí, los pasos pesados solo corren si es MAJOR ---

      - name: Setup Node.js
        if: steps.tag_version.outputs.part == 'major'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        if: steps.tag_version.outputs.part == 'major'
        run: npm ci

      - name: Build Web App
        if: steps.tag_version.outputs.part == 'major'
        run: npm run build

      - name: Sync Capacitor
        if: steps.tag_version.outputs.part == 'major'
        run: npx cap sync android

      - name: Setup Java
        if: steps.tag_version.outputs.part == 'major'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK
        if: steps.tag_version.outputs.part == 'major'
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      # 3. Solo si la compilación tuvo éxito y es Major, creamos el Tag real
      - name: Push Tag
        if: steps.tag_version.outputs.part == 'major'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # 4. Crear el Release con la APK adjunta
      - name: Create a GitHub release
        uses: softprops/action-gh-release@v2
        if: steps.tag_version.outputs.part == 'major'
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: android/app/build/outputs/apk/debug/app-debug.apk